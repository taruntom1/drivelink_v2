name: CI

on:
  push:
    branches: [main, host_overhaul]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The commands of every check are in tools/validate.py, which is also what
# runs locally. A job here only provides the toolchain and names its checks.
jobs:
  host-linux:
    name: Host Linux (Ubuntu 26.04)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install host toolchain
        run: apt-get update && apt-get install -y build-essential cmake ninja-build python3 python3-yaml git ca-certificates
      - uses: actions/checkout@v4
      - name: Build (warnings are errors), test against TCP and PTY vdev, check the installed packages
        run: python3 tools/validate.py --only host-linux

  firmware:
    name: idf.py build (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: firmware
            check: fw
          - name: firmware, console logs off
            check: fw-nolog
          - name: firmware/test/uart_comm
            check: fw-hil-app
    steps:
      - uses: actions/checkout@v4

      - name: Build (zero warnings)
        shell: bash
        run: |
          set -eo pipefail
          # The checkout is owned by another user than the container's;
          # IDF runs git to stamp the app version.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          python3 tools/validate.py --only ${{ matrix.check }}

  native-tests:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja and PyYAML
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3-yaml

      - name: Generated files, generator tests, Python frame reference, native tests
        run: python3 tools/validate.py --only gen native
