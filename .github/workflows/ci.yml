name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: idf.py build (${{ matrix.app }})
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    strategy:
      fail-fast: false
      matrix:
        app: [".", "test/uart_comm"]
    steps:
      - uses: actions/checkout@v4

      - name: Build (zero warnings)
        shell: bash
        run: |
          set -eo pipefail
          # The checkout is owned by another user than the container's;
          # IDF runs git to stamp the app version.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py -C "${{ matrix.app }}" build 2>&1 | tee build.log
          if grep -E "warning:" build.log; then
            echo "::error::Compiler warnings found; the build must stay warning-free."
            exit 1
          fi

  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake -S test/host -B test/host/build -G Ninja

      - name: Build
        run: cmake --build test/host/build

      - name: Test
        run: ctest --test-dir test/host/build --output-on-failure
