name: CI

on:
  push:
    branches: [main, firmware_overhaul]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-linux:
    name: Host Linux (Ubuntu 26.04)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install host toolchain
        run: apt-get update && apt-get install -y build-essential cmake ninja-build python3 python3-yaml git ca-certificates
      - uses: actions/checkout@v4
      - name: Configure
        working-directory: host/superbuild
        run: cmake --preset linux-no-gui
      - name: Build (warnings are errors)
        working-directory: host/superbuild
        run: cmake --build --preset linux --parallel 4
      - name: Test host and CLI against TCP and PTY vdev
        working-directory: host/superbuild
        run: ctest --preset linux
      - name: Test installed CMake packages
        run: python3 host/test/install_smoke.py --build host/superbuild/build/linux

  firmware:
    name: idf.py build (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: firmware
            app: "firmware"
            defaults: ""
          - name: firmware, console logs off
            app: "firmware"
            defaults: "sdkconfig.defaults;sdkconfig.ci.nolog"
          - name: firmware/test/uart_comm
            app: "firmware/test/uart_comm"
            defaults: ""
    steps:
      - uses: actions/checkout@v4

      - name: Build (zero warnings)
        shell: bash
        run: |
          set -eo pipefail
          # The checkout is owned by another user than the container's;
          # IDF runs git to stamp the app version.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          # Build from inside the app, so every relative path (build dir,
          # sdkconfig, defaults files) resolves against the app.
          cd "${{ matrix.app }}"
          if [ -n "${{ matrix.defaults }}" ]; then
            # A separate build dir and sdkconfig, so the variant never
            # touches the default configuration.
            idf.py -B build_variant \
              -D SDKCONFIG=build_variant/sdkconfig \
              -D SDKCONFIG_DEFAULTS="${{ matrix.defaults }}" build 2>&1 | tee build.log
          else
            idf.py build 2>&1 | tee build.log
          fi
          if grep -E "warning:" build.log; then
            echo "::error::Compiler warnings found; the build must stay warning-free."
            exit 1
          fi

  native-tests:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja and PyYAML
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3-yaml

      - name: Check the generated headers and docs
        run: python3 tools/gen/gen.py --check

      - name: Generator unit tests
        run: python3 -m unittest discover -s tools/gen/tests

      - name: Check the Python frame reference (HIL protocol.py)
        run: python3 firmware/test/uart_comm/protocol.py

      - name: Configure
        run: cmake -S firmware/test/native -B firmware/test/native/build -G Ninja

      - name: Build
        run: cmake --build firmware/test/native/build

      - name: Test
        run: ctest --test-dir firmware/test/native/build --output-on-failure
