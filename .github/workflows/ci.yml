name: CI

on:
  push:
    branches: [main, host_overhaul]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The commands of every check are in tools/validate.py, which is also what
# runs locally. A job here only provides the toolchain and names its checks.
jobs:
  host-windows:
    name: Host Windows (Qt MinGW 13.1)
    runs-on: windows-2025
    env:
      CMAKE_PREFIX_PATH: C:/Qt/6.12.0/mingw_64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache the pinned Qt and MinGW kit
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: C:/Qt
          key: windows-2025-qt-6.12.0-mingw-13.1.0-aqt-5a49f2b-tools-v1
      - name: Install Qt 6.12.0 and Qt's build tools
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Released aqt 3.3.0 predates the split Windows Qt 6.11+ repositories.
          # Pin the upstream revision that supports them; never patch vendored code.
          python -m pip install 'aqtinstall @ https://github.com/miurahr/aqtinstall/archive/5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7.zip'
          python -m aqt install-qt windows desktop 6.12.0 win64_mingw -O C:/Qt
          python -m aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 -O C:/Qt
          python -m aqt install-tool windows desktop tools_cmake qt.tools.cmake -O C:/Qt
          python -m aqt install-tool windows desktop tools_ninja qt.tools.ninja -O C:/Qt
      - name: Build (warnings are errors), test (GUI offscreen) and check the installed packages
        timeout-minutes: 30
        run: |
          $qtVersion = & 'C:/Qt/6.12.0/mingw_64/bin/qmake.exe' -query QT_VERSION
          if ($LASTEXITCODE -ne 0 -or $qtVersion -ne '6.12.0') { throw "Expected Qt 6.12.0, found $qtVersion" }
          python tools/validate.py --only host-win
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-windows-validation
          path: build/validate/

  host-linux:
    name: Host Linux (Ubuntu 26.04)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      # actions/checkout needs git to keep a repository; every other package
      # comes from tools/setup_linux.sh.
      - name: Bootstrap git for the checkout
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Install the host packages (compilers, CMake, Ninja, Qt 6.10)
        run: sh tools/setup_linux.sh host
      - name: Build (warnings are errors), test against TCP and PTY vdev and the GUI offscreen, check the installed packages
        run: python3 tools/validate.py --only host-linux

  firmware:
    name: idf.py build (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: firmware
            check: fw
          - name: firmware, console logs off
            check: fw-nolog
          - name: firmware/test/uart_comm
            check: fw-hil-app
    steps:
      - uses: actions/checkout@v4

      - name: Build (zero warnings)
        shell: bash
        run: |
          set -eo pipefail
          # The checkout is owned by another user than the container's;
          # IDF runs git to stamp the app version.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          python3 tools/validate.py --only ${{ matrix.check }}

  native-tests:
    name: Native unit tests
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Bootstrap git for the checkout
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Install the native toolchain and PyYAML
        run: sh tools/setup_linux.sh base

      - name: Generated files, generator tests, Python frame reference, native tests
        run: python3 tools/validate.py --only gen native
