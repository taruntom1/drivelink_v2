name: CI

on:
  push:
    branches: [main, host_overhaul]
    # A v<VERSION> tag also publishes a GitHub Release (job release).
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The commands of every check are in tools/validate.py, which is also what
# runs locally. A job here only provides the toolchain and names its checks.
jobs:
  # Tests and packages are separate jobs: a test failure does not hide the
  # package's result, and each finishes sooner.
  host-windows-tests:
    name: Host Windows tests (Qt MinGW 13.1)
    runs-on: windows-2025
    env:
      CMAKE_PREFIX_PATH: C:/Qt/6.12.0/mingw_64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-qt
      - name: Build (warnings are errors), test (GUI offscreen), check the installed packages
        timeout-minutes: 45
        run: python tools/validate.py --only host-win
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-windows-tests-validation
          path: build/validate/

  host-windows-package:
    name: Host Windows package (installer)
    runs-on: windows-2025
    env:
      CMAKE_PREFIX_PATH: C:/Qt/6.12.0/mingw_64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-qt
      - name: Install Inno Setup 6 when the runner lacks it
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe')) {
            choco install innosetup --version 6.7.1 --no-progress -y
          }
      - name: Release build, staged smoke with Qt off PATH, Inno Setup installer
        timeout-minutes: 30
        run: python tools/validate.py --only installer
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: drivelink-windows-installer
          path: build/installer/DriveLink-*-setup.exe
          if-no-files-found: error
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-windows-package-validation
          path: build/validate/

  host-linux-tests:
    name: Host Linux tests (Ubuntu 26.04)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      # actions/checkout needs git to keep a repository; every other package
      # comes from tools/setup_linux.sh.
      - name: Bootstrap git for the checkout
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Install the host packages (compilers, CMake, Ninja, Qt 6.10)
        run: sh tools/setup_linux.sh host
      - name: Build (warnings are errors), test against TCP and PTY vdev and the GUI offscreen, check the installed packages
        run: python3 tools/validate.py --only host-linux

  agent:
    name: drivelink-agent build and tests (Ubuntu 26.04)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Bootstrap git for the checkout
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Install the agent packages (compilers, CMake, Ninja, Python 3)
        run: sh tools/setup_linux.sh agent
      - name: Build without the GUI (warnings are errors), unit and integration tests
        run: python3 tools/validate.py --only agent
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-validation
          path: build/validate/

  # H3c: drivelink-cli and drivelink-agent for Ubuntu 26.04 and 24.04, the
  # GUI's drivelink for 26.04 only (24.04's Qt 6.4 is below the 6.10 floor),
  # each on its own architecture's runner. 24.04 also holds the GCC 13 floor.
  linux-package:
    name: Linux packages (Ubuntu ${{ matrix.release }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ubuntu:${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {release: '26.04', arch: amd64, runner: ubuntu-latest, profile: host}
          - {release: '26.04', arch: arm64, runner: ubuntu-24.04-arm, profile: host}
          - {release: '24.04', arch: amd64, runner: ubuntu-latest, profile: agent}
          - {release: '24.04', arch: arm64, runner: ubuntu-24.04-arm, profile: agent}
    steps:
      - name: Bootstrap git for the checkout
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Install the build packages (Qt 6.10 only where the GUI is built)
        run: sh tools/setup_linux.sh ${{ matrix.profile }}
      - name: Release build, staged smoke, .deb packages
        run: |
          # The checkout belongs to another user than the container's; the
          # version (VERSION+g<sha>) needs git.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/validate.py --only deb
      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: drivelink-debs-${{ matrix.release }}-${{ matrix.arch }}
          path: build/deb/*.deb
          if-no-files-found: error
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-package-validation-${{ matrix.release }}-${{ matrix.arch }}
          path: build/validate/

  linux-install:
    name: Linux packages installed in a clean container (Ubuntu ${{ matrix.release }}, ${{ matrix.arch }})
    needs: linux-package
    runs-on: ${{ matrix.runner }}
    container: ubuntu:${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {release: '26.04', arch: amd64, runner: ubuntu-latest}
          - {release: '26.04', arch: arm64, runner: ubuntu-24.04-arm}
          - {release: '24.04', arch: amd64, runner: ubuntu-latest}
          - {release: '24.04', arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      # Only git and Python: the packages' Depends must bring everything else.
      - name: Bootstrap git and Python
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates python3
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: drivelink-debs-${{ matrix.release }}-${{ matrix.arch }}
          path: deb
      - name: Install, upgrade (the agent is not restarted), remove, reinstall and purge
        run: python3 host/test/installed_packages_smoke.py --debs deb
      - name: apt install the GUI, every screen against the installed vdev, apt remove
        if: matrix.release == '26.04'
        run: python3 host/test/installed_gui_smoke.py --deb deb/drivelink_*.deb deb/drivelink-cli_*.deb --vdev --out build/installed-gui
      - name: Upload the screenshots
        if: always() && matrix.release == '26.04'
        uses: actions/upload-artifact@v4
        with:
          name: drivelink-installed-screens-${{ matrix.arch }}
          path: build/installed-gui/
          if-no-files-found: ignore

  firmware:
    name: idf.py build (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: firmware
            check: fw
          - name: firmware, console logs off
            check: fw-nolog
          - name: firmware/test/uart_comm
            check: fw-hil-app
    steps:
      - uses: actions/checkout@v4

      - name: Build (zero warnings)
        shell: bash
        run: |
          set -eo pipefail
          # The checkout is owned by another user than the container's;
          # IDF runs git to stamp the app version.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          python3 tools/validate.py --only ${{ matrix.check }}

  firmware-package:
    name: Firmware package (ESP32-S3)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4
      - name: Reconfigure, build (zero warnings), package
        shell: bash
        run: |
          set -eo pipefail
          # The checkout is owned by another user than the container's; the
          # version (VERSION+g<sha>) needs git.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          python3 tools/validate.py --only fw-package
      - name: Upload the firmware package
        uses: actions/upload-artifact@v4
        with:
          name: drivelink-firmware
          path: build/firmware/drivelink-firmware-*/
          if-no-files-found: error

  # On a v<VERSION> tag, after every check and package passed: one GitHub
  # Release with the firmware, the Windows installer and the Linux .deb.
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-windows-tests, host-windows-package, host-linux-tests, agent, linux-package,
            linux-install, firmware, firmware-package, native-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Check the tag against VERSION and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $version" >&2; exit 1
          fi
          # A tag build carries the plain version; a +g suffix means it was not.
          # Every asset goes flat into dist/release, which SHA256SUMS describes.
          mkdir dist/release
          firmware="drivelink-firmware-$version"
          cp "dist/drivelink-windows-installer/DriveLink-$version-setup.exe" dist/release/
          args=$(find dist/drivelink-firmware -name flash_args.json)
          test "$(jq -r .version "$args")" = "$version"
          (cd "$(dirname "$args")" && zip -r "$GITHUB_WORKSPACE/dist/release/$firmware.zip" .)
          # The .debs: cli and agent for 26.04 and 24.04, the GUI for 26.04,
          # each for amd64 and arm64 (release and architecture in the name).
          find dist -path 'dist/drivelink-debs-*' -name '*.deb' -exec cp {} dist/release/ \;
          count=$(find dist/release -name '*.deb' | wc -l)
          if [ "$count" -ne 10 ]; then echo "expected 10 .deb packages, found $count" >&2; exit 1; fi
          for deb in dist/release/*.deb; do
            case "$(basename "$deb")" in
              *_"$version"~ubuntu*_amd64.deb|*_"$version"~ubuntu*_arm64.deb) ;;
              *) echo "not a tag build: $deb" >&2; exit 1 ;;
            esac
          done
          (cd dist/release && sha256sum -- * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "DriveLink $version" --generate-notes dist/release/*

  native-tests:
    name: Native unit tests
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Bootstrap git for the checkout
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Install the native toolchain and PyYAML
        run: sh tools/setup_linux.sh base

      - name: Generated files, generator tests, Python frame reference, native tests
        run: python3 tools/validate.py --only gen native
