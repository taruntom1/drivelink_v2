# OpenOCD for the ESP32-S3's built-in USB-JTAG, started by tools/jtag.py.
# It differs from the stock board/esp32s3-builtin.cfg in four ways:
#  - Flash support is off: a session never writes flash (NVS, OTA slots), and
#    every breakpoint is a hardware one.
#  - The stock gdb-attach hook resets the chip when memory protection is on,
#    which it is in the normal firmware. Only the flash loader needs that, so
#    attaching here just halts.
#  - The stock config leaves the chip halted when GDB leaves. Here the board
#    runs again when GDB disconnects and when OpenOCD shuts down.
#  - The ports are fixed and local. 3333 can fall in a range that Hyper-V
#    reserves at boot (the bench PC's dynamic range is 1024-15000); 23333 is
#    outside that range and the Windows default range.
set ESP_FLASH_SIZE 0
source [find board/esp32s3-builtin.cfg]

bindto 127.0.0.1
gdb port 23333
tcl port 23334
telnet port disabled

proc drivelink_release { } {
    if { [esp32s3.cpu0 curstate] eq "halted" || [esp32s3.cpu1 curstate] eq "halted" } {
        # One halt in front, so that both cores are known to be halted.
        catch { halt 1000 }
        catch { rbp all }
        catch { rwp all }
        resume
    }
}

foreach t {esp32s3.cpu0 esp32s3.cpu1} {
    $t configure -event gdb-attach "$t xtensa smpbreak BreakIn BreakOut; halt 1000"
    # Not gdb-end: that one comes at every stop.
    $t configure -event gdb-detach { drivelink_release }
}
lappend ::pre_shutdown_commands drivelink_release

# The first 64 words of the running app's esp_app_desc_t, or an error. It is the
# first object in the mapped read-only data, after the 32-byte image header of a
# 64 KB page; which page depends on the size of the code before it.
proc drivelink_app_desc { } {
    for { set page 0 } { $page < 128 } { incr page } {
        set addr [expr { 0x3C000020 + $page * 0x10000 }]
        if { [read_memory $addr 32 1] == 0xABCD5432 } {
            return [read_memory $addr 32 64]
        }
    }
    error "no app description found"
}
