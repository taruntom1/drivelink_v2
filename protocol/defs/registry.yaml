# The wire registry: every MSG_TYPE and stream channel range of the protocol.
# After editing, run:
#
#   python tools/gen/gen.py
#
# and commit the regenerated files with this one (CI fails if they are stale):
#   protocol/include/drivelink/protocol/gen/registry.hpp
#   docs/protocol/registry.md
#
# Rules:
#   - Values are unique, between 0x01 and 0xFE, and fall in the MSG_TYPE
#     classes of docs/protocol/framing.md: command 0x01-0x3F, response
#     0x40-0x7F, stream 0x80-0xBF, event 0xC0-0xFE.
#   - direction: host_to_esp | esp_to_host | both | host_to_agent | agent_to_host
#     (the agent pair never reaches a device; docs/protocol/agent.md)
#   - channel_ranges: stream channels the core hands out in groups. A range
#     holds no msg_type entries; the generated header exports its first
#     channel and channel count.
#   - `symbol` names the generated constants: k<symbol>ChannelFirst and
#     k<symbol>ChannelCount.
#   - Module type ids live in each type's own file. Only the id reserved for
#     `system` is set here.
#   - Time ping uses an independent v1 on 0x02 / 0x42 (F8).

system_type_id: 0x00
loop_type_id: 0x05

msg_types:
  # -- core (F3 on) --
  - {name: core_command,           value: 0x01, direction: host_to_esp, description: "Core command (family, op). Not used until F3."}
  - {name: core_response,          value: 0x41, direction: esp_to_host, description: "Answer to a core command."}
  - {name: disarm,                 value: 0x03, direction: host_to_esp, description: "DISARM fast path, handled in the RX callback and never queued."}
  - {name: core_event,             value: 0xC1, direction: esp_to_host, description: "Core events: capture done, test signal done, layout applied, OTA state, arm state change."}
  - {name: status_stream,          value: 0x80, direction: esp_to_host, description: "System status stream, also the heartbeat."}

  # -- diag --
  - {name: diag_query,             value: 0x23, direction: host_to_esp, description: "diag query: GetInfo, GetEntries, Clear."}
  - {name: diag_query_response,    value: 0x63, direction: esp_to_host, description: "Answer to a diag query."}
  - {name: diag_event,             value: 0xC0, direction: esp_to_host, description: "diag events: Record, CounterDelta, Cleared, Boot."}

  # -- time protocol v1 --
  - {name: time_request, value: 0x02, direction: host_to_esp, description: "Host time ping, answered directly in RX."}
  - {name: time_response, value: 0x42, direction: esp_to_host, description: "Time reply with monotonic RX and TX-submission timestamps."}

  # -- agent protocol v2 (H3a): between a host client and drivelink-agent only,
  #    never forwarded to a device. docs/protocol/agent.md.
  - {name: agent_command,  value: 0x30, direction: host_to_agent, description: "Agent command (op): hello, device list, lease, client list, time ping. Answered by the agent, never forwarded."}
  - {name: agent_response, value: 0x70, direction: agent_to_host, description: "Answer to an agent command."}
  - {name: agent_event,    value: 0xF0, direction: agent_to_host, description: "Agent events: closing, lease change, clock model, history."}

channel_ranges:
  - {name: sub_groups, symbol: SubGroup, first: 0x81, last: 0x9F, direction: esp_to_host, description: "Subscription groups 0-30."}
  - {name: cmd_groups, symbol: CmdGroup, first: 0xA0, last: 0xBF, direction: host_to_esp, description: "Command groups 0-31."}

