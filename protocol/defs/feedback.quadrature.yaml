type: feedback.quadrature
type_id: 0x22
realtime: required
items:
  - {id: 1, kind: param, name: pin_a, type: u8, flags: [reboot_required], gpio: true, description: "Encoder channel A. One PCNT unit per instance; at most 4."}
  - {id: 2, kind: param, name: pin_b, type: u8, flags: [reboot_required], gpio: true, description: "Encoder channel B."}
  - {id: 3, kind: param, name: pullup, type: bool, flags: [reboot_required], default: true, description: "Internal pull-ups on A and B."}
  - {id: 4, kind: param, name: counts_per_rev, type: f32, min: 1, max: 1000000, default: 1440, flags: [reboot_required], description: "Counts per motor revolution after 4x decoding."}
  - {id: 5, kind: param, name: gear_ratio, type: f32, min: 0.001, max: 10000, default: 1, flags: [reboot_required], description: "Motor revolutions per output revolution."}
  - {id: 6, kind: param, name: velocity_cutoff, type: f32, unit: Hz, min: 0, max: 5000, default: 30}
  - {id: 7, kind: param, name: invert, type: bool, flags: [locked_while_armed], default: false, description: "Reverse the count direction. A change flips the count's sign."}
  - {id: 258, kind: signal, name: count, type: i32}
  - {id: 256, kind: signal, name: velocity, type: f32, unit: rad/s}
  - {id: 257, kind: signal, name: position, type: f32, unit: rad}
